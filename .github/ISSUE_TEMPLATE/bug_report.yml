name: Bug report
description: Report a broken page, bad report, or generation issue.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or report date
      placeholder: "https://eshener.github.io/echo-trending/ or 2026-05-23"
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: context
    attributes:
      label: Additional context
