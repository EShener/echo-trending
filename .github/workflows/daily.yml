name: Echo Trending Hourly Update

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run daily
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          REPORT_TIMEZONE: Asia/Shanghai
          REPORT_RETENTION_DAYS: "90"
      - name: Publish static site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch public/.nojekyll
          rm -rf /tmp/echo-trending-pages
          mkdir -p /tmp/echo-trending-pages
          cp -R public/. /tmp/echo-trending-pages/
          cd /tmp/echo-trending-pages
          git init -b gh-pages
          git add .
          git commit -m "Deploy echo-trending site"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
